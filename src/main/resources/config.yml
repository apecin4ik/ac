# Сколько секунд игрок считается "в бою" после удара по игроку или от игрока
combat-seconds: 15

# Высыпать вещи только если причина кика содержит одно из этих слов (без учёта регистра).
# Подставь слова из сообщения, которое Grim показывает при кике за пакеты (см. messages.yml в Grim).
# Пустой список = высыпать при ЛЮБОМ кике во время боя.
reason-keywords:
  - "packet"

# Высыпать также опыт
drop-exp: true

# Сообщение всем в чат (пусто = не писать). {player} = ник
broadcast: "&c{player} &7вылетел за пакеты во время боя, вещи высыпались."

# Не высыпать у игроков с правом grimkickdrop.bypass (например, у админов)
